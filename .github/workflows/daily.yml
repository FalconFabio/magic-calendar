name: Build calendars daily

on:
  workflow_dispatch:
  schedule:
    # Cron en UTC (02:30 UTC tous les jours)
    - cron: "30 2 * * *"
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug PBS connectivity (logs)
        run: |
          echo "event_name=$GITHUB_EVENT_NAME"
          echo -n "egress_ip="; curl -s https://api.ipify.org || true; echo
          echo "PBS archive headers (first 20 lines):"
          curl -sI https://probilliardseries.com/events-archive/ | head -n 20 || true

      - name: Download previous prod xlsx (best effort)
        run: |
          mkdir -p prev
          PAGES_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "Trying to download previous: $PAGES_BASE/tournaments.xlsx"
          curl -fsSL -o prev/tournaments.xlsx "$PAGES_BASE/tournaments.xlsx" || true
          ls -lh prev || true

      - name: Generate Excel
        run: |
          # Fenêtre par défaut dans ton script (years-past/years-future)
          # Tu peux ajuster ici si tu veux une fenêtre prod différente
          python fetch_tournaments.py --out tournaments.xlsx

      - name: Keep previous PBS if missing
        run: |
          python - << 'PY'
          import os
          import pandas as pd

          cur_path = "tournaments.xlsx"
          prev_path = "prev/tournaments.xlsx"

          cur = pd.read_excel(cur_path)
          if "organizer" not in cur.columns:
            raise SystemExit("Current xlsx has no 'organizer' column")

          cur_pbs = cur[cur["organizer"]=="Predator/PBS"]
          if len(cur_pbs) > 0:
            print(f"[OK] PBS present in current: {len(cur_pbs)} rows")
            raise SystemExit(0)

          print("[WARN] PBS missing in current xlsx")

          if not os.path.exists(prev_path):
            print("[WARN] No previous xlsx available. Keeping current as-is.")
            raise SystemExit(0)

          prev = pd.read_excel(prev_path)
          if "organizer" not in prev.columns:
            print("[WARN] Previous xlsx has no 'organizer' column. Keeping current as-is.")
            raise SystemExit(0)

          prev_pbs = prev[prev["organizer"]=="Predator/PBS"]
          if len(prev_pbs) == 0:
            print("[WARN] Previous xlsx also has 0 PBS rows. Keeping current as-is.")
            raise SystemExit(0)

          # Align columns between current and previous PBS slice
          for c in prev_pbs.columns:
            if c not in cur.columns:
              cur[c] = ""
          for c in cur.columns:
            if c not in prev_pbs.columns:
              prev_pbs[c] = ""

          merged = pd.concat([cur, prev_pbs[cur.columns]], ignore_index=True)

          # Dedupe
          if "event_id" in merged.columns:
            merged["event_id"] = merged["event_id"].fillna("").astype(str)
            merged = merged[merged["event_id"].str.strip() != ""].append(
              merged[merged["event_id"].str.strip() == ""], ignore_index=True
            )
            merged = merged.drop_duplicates(subset=["event_id"], keep="first")
          else:
            keys = [c for c in ["start_date","title","organizer"] if c in merged.columns]
            if keys:
              merged = merged.drop_duplicates(subset=keys, keep="first")

          sort_cols = [c for c in ["start_date","organizer","title"] if c in merged.columns]
          if sort_cols:
            merged = merged.sort_values(sort_cols, kind="mergesort")

          merged.to_excel(cur_path, index=False)
          print(f"[OK] Reused PBS rows from previous: {len(prev_pbs)}")
          PY

      - name: Summary (organizer counts)
        run: |
          python - << 'PY'
          import pandas as pd
          df = pd.read_excel("tournaments.xlsx")
          print(df["organizer"].value_counts())
          print("PBS rows:", (df["organizer"]=="Predator/PBS").sum())
          PY

      - name: Generate ICS
        run: |
          python export_ics.py --xlsx tournaments.xlsx \
            --ics tournaments.ics \
            --ics-conflicts tournaments-conflicts.ics \
            --pbs-xlsx pbs.xlsx \
            --pbs-ics pbs.ics \
            --pbs-ics-conflicts pbs-conflicts.ics \
            --uid-domain "${{ github.repository_owner }}.github.io"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          mkdir -p public/debug
          cp tournaments.xlsx public/
          cp tournaments.ics public/
          cp tournaments-conflicts.ics public/
          cp pbs.xlsx public/
          cp pbs.ics public/
          cp pbs-conflicts.ics public/

          # Copier les dumps PBS si présents (super utile pour diagnostiquer les runs "night")
          ls -1 pbs_debug_*.html >/dev/null 2>&1 && cp pbs_debug_*.html public/debug/ || true

          # mini index
          cat > public/index.html << 'HTML'
          <html><body>
          <h1>US Pool calendars</h1>
          <ul>
            <li><a href="tournaments.ics">tournaments.ics</a></li>
            <li><a href="tournaments-conflicts.ics">tournaments-conflicts.ics</a></li>
            <li><a href="tournaments.xlsx">tournaments.xlsx</a></li>
            <li><a href="pbs.ics">pbs.ics</a></li>
            <li><a href="pbs-conflicts.ics">pbs-conflicts.ics</a></li>
            <li><a href="pbs.xlsx">pbs.xlsx</a></li>
            <li><a href="debug/">debug/</a></li>
          </ul>
          </body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
