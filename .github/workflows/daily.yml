name: Build calendars daily

on:
  workflow_dispatch:
    inputs:
      reformat_only:
        description: "Republish formatting from saved data without collecting sources"
        type: boolean
        default: false
  schedule:
    # One automatic collection per day, at 02:30 UTC.
    - cron: "30 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test calendar pipeline
        run: python -m unittest discover -s tests -v

      - name: Generate and reconcile calendars
        if: ${{ inputs.reformat_only != true }}
        run: python -u fetch_tournaments.py --out tournaments.xlsx --previous data/tournaments-backup.json --backup data/tournaments-backup.json --archive data/tournaments-archive.json --state data/calendar-state.json --refresh-from "$(date -u -d '30 days ago' +%F)" --report sync-status.json

      - name: Rebuild presentation without collecting sources
        if: ${{ inputs.reformat_only == true }}
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p previous
          curl --retry 3 --max-time 60 -fsSL "$PAGES_BASE/tournaments.xlsx" -o previous/tournaments.xlsx
          curl --retry 3 --max-time 60 -fsSL "$PAGES_BASE/sync-status.json" -o previous/sync-status.json
          python reformat_calendar.py --published-workbook previous/tournaments.xlsx --published-report previous/sync-status.json

      - name: Collection summary
        run: |
          python - << 'PYCODE'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("sync-status.json").read_text())
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Calendar collection\n\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
          if report["reused_previous"]:
              print("::warning::Some source/year groups use previous data. See sync-status.json.")
          PYCODE

      - name: Generate ICS
        run: |
          python export_ics.py --xlsx tournaments.xlsx \
            --ics tournaments.ics \
            --ics-conflicts tournaments-conflicts.ics \
            --pbs-xlsx pbs.xlsx \
            --pbs-ics pbs.ics \
            --pbs-ics-conflicts pbs-conflicts.ics \
            --state data/calendar-state.json --report sync-status.json --status-text sync-status.txt \
            --uid-domain "${{ github.repository_owner }}.github.io"

      - name: Save archive for repository backup
        uses: actions/upload-artifact@v4
        with:
          name: calendar-data
          path: |
            data/tournaments-archive.json
            data/calendar-state.json
            data/tournaments-backup.json
          if-no-files-found: error
          retention-days: 14

      - name: Save monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: sync-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          mkdir -p public/debug
          cp sync-status.json public/
          cp sync-status.txt public/
          cp data/tournaments-archive.json public/
          cp tournaments.xlsx public/
          cp tournaments.ics public/
          cp tournaments-conflicts.ics public/
          cp pbs.xlsx public/
          cp pbs.ics public/
          cp pbs-conflicts.ics public/

          # Copier les dumps PBS si présents (super utile pour diagnostiquer les runs "night")
          ls -1 pbs_debug_*.html >/dev/null 2>&1 && cp pbs_debug_*.html public/debug/ || true

          # mini index
          cat > public/index.html << 'HTML'
          <html><body>
          <h1>US Pool calendars</h1>
          <ul>
            <li><a href="tournaments.ics">tournaments.ics</a></li>
            <li><a href="tournaments-conflicts.ics">tournaments-conflicts.ics</a></li>
            <li><a href="tournaments.xlsx">tournaments.xlsx</a></li>
            <li><a href="pbs.ics">pbs.ics</a></li>
            <li><a href="pbs-conflicts.ics">pbs-conflicts.ics</a></li>
            <li><a href="pbs.xlsx">pbs.xlsx</a></li>
            <li><a href="sync-status.txt">Dernière synchronisation, alertes et changements</a></li>
            <li><a href="sync-status.json">Rapport détaillé des sources</a></li>
          </ul>
          </body></html>
          HTML

      - name: Validate all calendars and archives before publication
        env:
          REFORMAT_ONLY: ${{ inputs.reformat_only }}
        run: |
          if [ "$REFORMAT_ONLY" = "true" ]; then
            python validate_publication.py --root public --allow-stored-data
          else
            python validate_publication.py --root public
          fi

      - name: Save publication manifest
        uses: actions/upload-artifact@v4
        with:
          name: publication-manifest
          path: public/publication-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: publication-manifest
      - name: Verify the files actually served to subscribers
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python validate_publication.py --verify-url "$PAGES_BASE"

  keepalive:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calendar-data
          path: data
      - name: Back up history and record monthly publication
        # Monthly repository activity prevents the 60-day inactivity shutdown.
        # A GITHUB_TOKEN push does not trigger another workflow run.
        run: |
          month="$(date -u +%Y-%m)"
          if [ ! -f .github/calendar-heartbeat ] || [ "$(cat .github/calendar-heartbeat)" != "$month" ]; then
            echo "$month" > .github/calendar-heartbeat
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/calendar-heartbeat data/tournaments-archive.json data/calendar-state.json data/tournaments-backup.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserve tournament archives and record publication for $month"
          git push

  monitor:
    # Publish and persist incident state first, so an outage does not erase the
    # calendar or create the same alert on every daily run.
    needs: [deploy, keepalive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monitoring-report
      - name: Alert on new source incidents
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("sync-status.json").read_text())
          alerts = report.get("monitoring", {}).get("new_alerts", [])
          for alert in alerts:
              message = alert["message"].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Calendar source alert::{message}")
          if alerts:
              raise SystemExit("New calendar incident(s). Publication succeeded; see the monitoring report.")
          print("No new incidents. Existing incidents remain visible in sync-status.txt.")
          PY
